apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trianz-enterprise-operations-ingress
  namespace: trianz-enterprise-operations
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - host: trianz-enterprise-operations.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trianz-enterprise-operations-service
                port:
                  number: 80
